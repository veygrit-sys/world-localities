name: Africa pinned gbOpen administrative intake

on:
  push:
    branches: [africa-priority-waves-20261106]
    paths:
      - registries/africa/import_pinned_boundary_units.py
      - registries/africa/reconcile_boundary_gaps.py
      - registries/africa/triage_unresolved.py
      - .github/workflows/africa-boundary-intake.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: africa-pinned-boundary-intake
  cancel-in-progress: false

jobs:
  import-public-licensed-data:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout comparison branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned geometry engine
        run: python -m pip install shapely==2.1.2
      - name: Download exact SHA-verified publicly licensed boundaries and classify parent gaps
        run: |
          python registries/africa/reconcile_boundary_gaps.py
          test -f registries/africa/reference-boundaries/KEN-ADM2-source-units.csv
          test -f registries/africa/reference-boundaries/GHA-ADM2-source-units.csv
          test -f registries/africa/reference-boundaries/unresolved-spatial-review.csv
      - name: Commit source-traceable output on this review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registries/africa/reference-boundaries/
          if ! git diff --cached --quiet; then
            git commit -m "data(africa): add pinned IEBC/OCHA and GSS administrative gazetteers with spatial review"
            git push origin HEAD:africa-priority-waves-20261106
          else
            echo "No new source-derived output"
          fi

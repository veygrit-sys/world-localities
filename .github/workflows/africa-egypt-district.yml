name: Africa Egypt pinned CAPMAS district reference
on:
  push:
    branches: [africa-wave1-wave2-expansion-20261106]
    paths:
      - registries/africa/import_egypt_capmas_2020.py
      - .github/workflows/africa-egypt-district.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: africa-egypt-source-2020
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Import 365 SHA-verified government-origin ADM2 units
        run: python registries/africa/import_egypt_capmas_2020.py
      - name: Commit derived reference only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registries/africa/official-references/EG-CAPMAS-OCHA-2020-ADM2.csv
          git add registries/africa/official-references/EG-CAPMAS-OCHA-2020-ADM2.source.json
          if ! git diff --cached --quiet; then
            git commit -m "data(africa): pin 2020 OCHA/CAPMAS Egypt 365 ADM2 units"
            git pull --rebase origin africa-wave1-wave2-expansion-20261106
            git push origin HEAD:africa-wave1-wave2-expansion-20261106
          fi

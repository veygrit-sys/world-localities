name: Africa OSM place-name source intake (ZA NG KE GH)

on:
  push:
    branches: [africa-wave1-wave2-expansion-20261106]
    paths:
      - registries/africa/import_osm_place_nodes.py
      - .github/workflows/africa-osm-localities.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: africa-geofabrik-source-places-v1
  cancel-in-progress: false

jobs:
  per-country:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        country: [ZA, NG, KE, GH]
    env:
      COUNTRY: ${{ matrix.country }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned OSM parser
        run: python -m pip install osmium==4.3.2
      - name: Download MD5-checked Geofabrik PBF; retain named place nodes only
        run: |
          python registries/africa/import_osm_place_nodes.py --country "$COUNTRY"
          python - <<'PY'
          import csv, gzip, hashlib, json, pathlib, os
          c=os.environ['COUNTRY']
          d=pathlib.Path("registries/africa/osm-localities")/c
          meta=json.loads((d/"source-receipt.json").read_text(encoding="utf-8"))
          p=d/"place-nodes.csv.gz"
          assert p.is_file()
          assert meta["derived_sha256"]==hashlib.sha256(p.read_bytes()).hexdigest()
          assert meta["country"]==c and meta["place_node_rows"]>=100
          with gzip.open(p,"rt",encoding="utf-8",newline="") as source:
              reader=csv.DictReader(source)
              count=sum(1 for row in reader if row["osm_id"].startswith("osm:node:"))
          assert count==meta["place_node_rows"]
          assert not meta["official_admin_parent_verified"]
          print(c, "source-preserved ODbL place nodes",count)
          PY
      - name: Commit isolated ODbL source rows to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "registries/africa/osm-localities/$COUNTRY"
          if ! git diff --cached --quiet; then
            git commit -m "data(africa): import Geofabrik ODbL named place nodes for $COUNTRY"
            git pull --rebase origin africa-wave1-wave2-expansion-20261106
            git push origin HEAD:africa-wave1-wave2-expansion-20261106
          fi

name: Crown Dependencies and Gibraltar locality evidence

on:
  push:
    paths:
      - scripts/crown_four_localities.py
      - tests/test_crown_four_localities.py
      - registries/europe/crown-four/**
      - .github/workflows/crown-four-localities.yml
      - localities/__main__.py
  pull_request:
    paths:
      - scripts/crown_four_localities.py
      - tests/test_crown_four_localities.py
      - registries/europe/crown-four/**
      - .github/workflows/crown-four-localities.yml
      - localities/__main__.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run offline regression suite
        run: |
          python -m py_compile scripts/crown_four_localities.py
          python -m unittest discover -s tests -p 'test_crown_four_localities.py' -v
      - name: Audit all repository GeoNames data and build source separated index
        run: |
          mkdir -p evidence
          python -m localities crown audit > evidence/audit.json
          python -m localities crown build --output "$RUNNER_TEMP/crown-four-base.sqlite" > evidence/build.json
          python -m localities crown verify --db "$RUNNER_TEMP/crown-four-base.sqlite" > evidence/verify.json
          python -m localities crown query --db "$RUNNER_TEMP/crown-four-base.sqlite" --country GI --text 'GX11 1AA' > evidence/gibraltar.json
          python -m localities crown query --db "$RUNNER_TEMP/crown-four-base.sqlite" --country IM --text 'Arbory and Rushen' > evidence/man-authority.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crown-four-accepted-audit
          path: evidence/
          retention-days: 30

  full-odbl-source-intake:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: offline-source-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned pyosmium OSM PBF reader
        run: python -m pip install 'osmium==4.2.0'
      - name: Fetch exact national/regional source bytes with receipts
        run: |
          mkdir -p "$RUNNER_TEMP/crown-pbf" evidence
          python scripts/crown_four_localities.py download --source guernsey-jersey --directory "$RUNNER_TEMP/crown-pbf" > evidence/ci-download.json
          python scripts/crown_four_localities.py download --source isle-of-man --directory "$RUNNER_TEMP/crown-pbf" > evidence/im-download.json
      - name: Full region PBF scan and immutable source evidence index
        run: |
          python scripts/crown_four_localities.py build \
            --output "$RUNNER_TEMP/crown-four-osm.sqlite" --source-root "$RUNNER_TEMP/crown-pbf" \
            --pin "$RUNNER_TEMP/crown-pbf/guernsey-jersey-source-pin.json" \
            --pin "$RUNNER_TEMP/crown-pbf/isle-of-man-source-pin.json" > evidence/full-build.json
          python -m localities crown verify --db "$RUNNER_TEMP/crown-four-osm.sqlite" > evidence/full-verify.json
          python -m localities crown query --db "$RUNNER_TEMP/crown-four-osm.sqlite" --country UNRESOLVED --kind named_road_segment > evidence/unresolved-examples.json
          printf '%s\n' 'ODbL 1.0. Attribution: © OpenStreetMap contributors; Geofabrik extracts.' \
            'JE/GG bounding boxes and shared region are not legal boundary assignments.' \
            'GI has only official textual postcode reference, not an OSM extract.' > evidence/NOTICE.txt
      - name: Upload source receipts, count/quality report and SQLite index
        run: |
          zstd -T0 -5 "$RUNNER_TEMP/crown-four-osm.sqlite" -o evidence/crown-four-osm.sqlite.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crown-four-geofabrik-odbl-evidence
          path: evidence/
          retention-days: 14

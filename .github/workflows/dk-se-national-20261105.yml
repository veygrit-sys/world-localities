name: DK and SE complete national OSM extraction 2026-11-05

on:
  push:
    branches:
      - ingest/dk-se-national-20261105
    paths:
      - .github/workflows/dk-se-national-20261105.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dk-se-full-osm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-country:
    name: Nationwide PBF to SQLite - ${{ matrix.country }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - country: DK
            filename: denmark
          - country: SE
            filename: sweden
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install OSM reader
        run: python -m pip install 'osmium==4.2.0'
      - name: Validate importer before national run
        run: |
          python -m unittest discover -s tests -p test_dk_se_open_osm.py -v
          python -m py_compile scripts/dk_se_open_osm.py
      - name: Prepare immutable sources and reports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/national-raw" "$RUNNER_TEMP/reports" "$RUNNER_TEMP/indices"
          df -h "$RUNNER_TEMP"
          python -V
          echo "country=${{ matrix.country }}" > "$RUNNER_TEMP/reports/run-context.txt"
          echo "git_sha=$GITHUB_SHA" >> "$RUNNER_TEMP/reports/run-context.txt"
      - name: Download full national Geofabrik PBF with pinned SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dk_se_open_osm.py download \
            --country '${{ matrix.country }}' \
            --directory "$RUNNER_TEMP/national-raw" | tee "$RUNNER_TEMP/reports/download.json"
          cp "$RUNNER_TEMP/national-raw/${{ matrix.filename }}-source-pin.json" "$RUNNER_TEMP/reports/source-pin.json"
          df -h "$RUNNER_TEMP"
      - name: Build full nationwide candidate index
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dk_se_open_osm.py build \
            --pin "$RUNNER_TEMP/national-raw/${{ matrix.filename }}-source-pin.json" \
            --source-root "$RUNNER_TEMP/national-raw" \
            --output "$RUNNER_TEMP/indices/${{ matrix.filename }}-osm-candidates.sqlite" \
            | tee "$RUNNER_TEMP/reports/build.json"
          df -h "$RUNNER_TEMP"
      - name: Verify completed index and source integrity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/dk_se_open_osm.py verify \
            --db "$RUNNER_TEMP/indices/${{ matrix.filename }}-osm-candidates.sqlite" \
            | tee "$RUNNER_TEMP/reports/verify.json"
          python - <<'PY'
          import json, pathlib, os
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'reports'
          b=json.loads((d/'build.json').read_text())
          v=json.loads((d/'verify.json').read_text())
          assert v.get('status') == 'PASS', v
          assert b.get('source_receipt',{}).get('fixture') is False, b
          assert b.get('national_completeness_verified') is False
          print('VERIFIED_NATIONWIDE_EXTRACT', json.dumps({'country':b.get('country'), 'counts':b.get('counts'), 'build_status':b.get('status'), 'verify_status':v.get('status')},ensure_ascii=False))
          PY
      - name: Compress complete SQLite index
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/indices"
          zstd -T0 -3 '${{ matrix.filename }}-osm-candidates.sqlite' -o '${{ matrix.filename }}-osm-candidates.sqlite.zst'
          sha256sum '${{ matrix.filename }}-osm-candidates.sqlite.zst' | tee "$RUNNER_TEMP/reports/compressed-sha256.txt"
          ls -lh *.sqlite*
      - name: Upload validation and original source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dk-se-${{ matrix.country }}-nationwide-reports
          path: ${{ runner.temp }}/reports/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload nationwide indexed database
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dk-se-${{ matrix.country }}-nationwide-sqlite-zst
          path: ${{ runner.temp }}/indices/${{ matrix.filename }}-osm-candidates.sqlite.zst
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
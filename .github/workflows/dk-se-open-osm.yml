name: DK-SE independent OSM locality intake

on:
  push:
    paths:
      - scripts/dk_se_open_osm.py
      - tests/test_dk_se_open_osm.py
      - registries/nordics/dk-se-open/**
      - .github/workflows/dk-se-open-osm.yml
  pull_request:
    paths:
      - scripts/dk_se_open_osm.py
      - tests/test_dk_se_open_osm.py
      - registries/nordics/dk-se-open/**
      - .github/workflows/dk-se-open-osm.yml
  workflow_dispatch:
    inputs:
      country:
        description: Denmark (DK) or Sweden (SE) — one full-country extract per run
        required: true
        default: DK
        type: choice
        options:
          - DK
          - SE
      upload_index:
        description: Upload the full compressed SQLite index (may be large and consume quota)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install PBF reader for integration fixture
        run: python -m pip install 'osmium==4.2.0'
      - run: python -m unittest discover -s tests -p 'test_dk_se_open_osm.py' -v
      - run: python -m py_compile scripts/dk_se_open_osm.py

  full-open-source-import:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COUNTRY: ${{ inputs.country }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned PBF reader
        run: python -m pip install 'osmium==4.2.0'
      - name: Download source snapshot with an immutable exact-byte receipt
        run: |
          mkdir -p "$RUNNER_TEMP/osm-raw"
          python scripts/dk_se_open_osm.py download --country "$COUNTRY" --directory "$RUNNER_TEMP/osm-raw" > "$RUNNER_TEMP/download-report.json"
      - name: Import source as *candidate* records (not certified addresses)
        run: |
          if [ "$COUNTRY" = DK ]; then NAME=denmark; else NAME=sweden; fi
          python scripts/dk_se_open_osm.py build \
            --pin "$RUNNER_TEMP/osm-raw/$NAME-source-pin.json" \
            --source-root "$RUNNER_TEMP/osm-raw" \
            --output "$RUNNER_TEMP/$NAME-osm-candidates.sqlite" > "$RUNNER_TEMP/build-report.json"
          python scripts/dk_se_open_osm.py verify \
            --db "$RUNNER_TEMP/$NAME-osm-candidates.sqlite" > "$RUNNER_TEMP/verify-report.json"
      - name: Collect report artifact (not a nationwide completion certificate)
        run: |
          mkdir -p artifacts
          cp "$RUNNER_TEMP/download-report.json" artifacts/
          cp "$RUNNER_TEMP/build-report.json" artifacts/
          cp "$RUNNER_TEMP/verify-report.json" artifacts/
          printf '%s\n' "License: ODbL 1.0" "Attribution: © OpenStreetMap contributors; extract by Geofabrik" \
            "Caveat: community observations, not authoritative or nationally complete postal addresses" > artifacts/README.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dk-se-${{ inputs.country }}-source-evidence-report
          path: artifacts/
          retention-days: 14
      - name: Compress full result only on explicit request
        if: inputs.upload_index == true
        run: |
          if [ "$COUNTRY" = DK ]; then NAME=denmark; else NAME=sweden; fi
          zstd -T0 -3 "$RUNNER_TEMP/$NAME-osm-candidates.sqlite" -o "artifacts/$NAME-osm-candidates.sqlite.zst"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.upload_index == true
        with:
          name: dk-se-${{ inputs.country }}-odbl-sqlite-index
          path: artifacts/*.zst
          retention-days: 7

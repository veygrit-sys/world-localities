name: Eastern four locality source audit and index

on:
  push:
    paths:
      - scripts/eastern_four_localities.py
      - tests/test_eastern_four_localities.py
      - registries/europe/eastern-four/**
      - localities/__main__.py
      - .github/workflows/eastern-four-localities.yml
  pull_request:
    paths:
      - scripts/eastern_four_localities.py
      - tests/test_eastern_four_localities.py
      - registries/europe/eastern-four/**
      - localities/__main__.py
      - .github/workflows/eastern-four-localities.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-four-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install native workbook reader for official XLSX fixture tests
        run: python -m pip install 'openpyxl>=3.1,<4'
      - name: Compile and run offline regression tests
        run: |
          python -m py_compile scripts/eastern_four_localities.py
          python -m unittest discover -s tests -p 'test_eastern_four_localities.py' -v
          python -m localities eastern inventory > /dev/null
      - name: Audit 272110 saved GeoNames observations and build searchable index
        run: |
          mkdir -p evidence
          python -m localities eastern audit --country all > evidence/four-country-audit.json
          python -m localities eastern build --country all --output "$RUNNER_TEMP/eastern-four.sqlite" > evidence/index-build.json
          python -m localities eastern verify --db "$RUNNER_TEMP/eastern-four.sqlite" > evidence/index-verify.json
          python -m localities eastern query --country UA --text Київ --db "$RUNNER_TEMP/eastern-four.sqlite" > evidence/ukraine-query.json
          python -m localities eastern query --country RU --text Москва --db "$RUNNER_TEMP/eastern-four.sqlite" > evidence/russia-query.json
          printf '%s\n' 'GeoNames locality and provenance verification only; no new official national address datasets added; no delivery claims' > evidence/README.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eastern-four-verified-gazetteer-evidence
          path: evidence/
          retention-days: 30

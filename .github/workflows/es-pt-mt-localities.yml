name: Spain Portugal Malta locality integrity
on:
  push:
    paths:
      - scripts/es_pt_mt_precision.py
      - tests/test_es_pt_mt_precision.py
      - registries/europe/es-pt-mt/**
      - .github/workflows/es-pt-mt-localities.yml
  pull_request:
    paths:
      - scripts/es_pt_mt_precision.py
      - tests/test_es_pt_mt_precision.py
      - registries/europe/es-pt-mt/**
      - .github/workflows/es-pt-mt-localities.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Offline source-parser tests
        run: python -m unittest discover -s tests -p test_es_pt_mt_precision.py -v
      - name: Validate all pinned GeoNames files and build index
        run: |
          python scripts/es_pt_mt_precision.py build --output "$RUNNER_TEMP/es-pt-mt-baseline.sqlite" > "$RUNNER_TEMP/es-pt-mt-build.json"
          python scripts/es_pt_mt_precision.py verify --db "$RUNNER_TEMP/es-pt-mt-baseline.sqlite" > "$RUNNER_TEMP/es-pt-mt-verify.json"
          python scripts/es_pt_mt_precision.py search --db "$RUNNER_TEMP/es-pt-mt-baseline.sqlite" --country MT --text Valletta > "$RUNNER_TEMP/es-pt-mt-query-example.json"
          python - "$RUNNER_TEMP/es-pt-mt-verify.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['status']=='PASS'
          assert data['counts']=={'ES:geonames':39207,'PT:geonames':22115,'MT:geonames':361}, data['counts']
          assert data['total_observations']==61683
          assert data['delivery_verified'] is False
          PY
      - name: Package evidence reports (no national address certification)
        run: |
          mkdir -p reports
          cp "$RUNNER_TEMP"/es-pt-mt-{build,verify,query-example}.json reports/
          printf '%s\n' 'These are audited GeoNames feature observations, NOT nationally certified official or deliverable addresses.' 'License: GeoNames CC-BY-4.0; honor individual license conditions before redistributing joined sources.' > reports/README.txt
          zstd -3 "$RUNNER_TEMP/es-pt-mt-baseline.sqlite" -o reports/es-pt-mt-baseline.sqlite.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: es-pt-mt-existing-geonames-verified-index
          path: reports/
          retention-days: 14

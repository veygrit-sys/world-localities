name: Europe source access and Iceland independent geodata probe
on:
  push:
    paths:
      - .github/workflows/europe-source-access-review.yml
  pull_request:
    paths:
      - .github/workflows/europe-source-access-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Inspect real public source responses (no auth bypass)
        run: |
          mkdir -p reports
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, hashlib, time
          from pathlib import Path
          # Every request is to a first-party public endpoint. No credentials,
          # hidden API, automated CAPTCHA, or session impersonation.
          urls={
            "IS-LMI-WFS-capabilities":"https://gis.lmi.is/geoserver/IS_50V/wfs?service=WFS&request=GetCapabilities&version=2.0.0",
            "IS-LMI-WFS-small-geojson":"https://gis.lmi.is/geoserver/IS_50V/ows?service=WFS&version=2.0.0&request=GetFeature&typeNames=IS_50V:samgongur_linur&count=1&outputFormat=application/json",
            "IS-LMI-feature-layer":"https://portal.land.is/server/rest/services/Hosted/LMI_is50v_Samgongur/FeatureServer/72?f=json",
            "IS-LMI-roads-count":"https://portal.land.is/server/rest/services/Hosted/LMI_is50v_Samgongur/FeatureServer/72/query?"+urllib.parse.urlencode({"where":"1=1","returnCountOnly":"true","f":"json"}),
            "IS-LMI-roads-sample":"https://portal.land.is/server/rest/services/Hosted/LMI_is50v_Samgongur/FeatureServer/72/query?"+urllib.parse.urlencode({"where":"1=1","outFields":"objectid,uuid,vegflokkun","returnGeometry":"true","outSR":"3057","resultRecordCount":5,"orderByFields":"objectid","f":"json"}),
            "IT-ANNCSU-national-street":"https://anncsu.open.agenziaentrate.gov.it/age-inspire/opendata/anncsu/getds.php?STRAD_ITA=",
            "IT-ANNCSU-regional-street":"https://anncsu.open.agenziaentrate.gov.it/age-inspire/opendata/anncsu/getds.php?STRAD_ABRU=",
            "IT-ANNCSU-catalog-service":"https://anncsu.open.agenziaentrate.gov.it/age-inspire/opendata/anncsu/querydata.php",
            "RS-RGZ-housenumber":"https://download.geosrbija.rs/download-api/opendata-proxy/export?category=ar&layer=kucni_broj_ar&geometry=true&fileName=kucni_br_csv&format=csv",
            "RS-RGZ-street":"https://download.geosrbija.rs/download-api/opendata-proxy/export?category=ar&layer=ulica_ar&geometry=true&fileName=ulica_csv&format=csv",
            "ES-CNIG-catalog":"https://centrodedescargas.cnig.es/CentroDescargas/cartociudad",
            "ES-CNIG-detail":"https://centrodedescargas.cnig.es/CentroDescargas/detalleArchivo?sec=42602",
            "ES-IDE-OGC-metadata":"https://api-features.idee.es/collections/address?f=json"
          }
          result={"examined_on":"2026-11-08","limits":"HEAD or 1KB body only: not a bulk-file acquisition; no special authentication","endpoints":{}}
          for key,url in urls.items():
            item={"source":url}
            try:
              method="GET" if key.startswith("IS-") or key=="ES-IDE-OGC-metadata" else "HEAD"
              req=urllib.request.Request(url,headers={"User-Agent":"Veygrit-localities-open-source-quality-review/1.0"},method=method)
              with urllib.request.urlopen(req,timeout=18) as response:
                body=response.read(6144 if key.startswith("IS-") else 1024) if method=="GET" else b""
                item.update({"http_status":response.status,"final_origin":urllib.parse.urlparse(response.url).netloc,"content_type":response.headers.get("Content-Type"),"content_length":response.headers.get("Content-Length"),"bytes_sampled":len(body)})
                if key.startswith("IS-"):
                  data=json.loads(body) if len(body)<6000 else {}
                  item["count"]=data.get("count")
                  item["metadata_name"]=data.get("name")
                  item["features_in_sample"]=len(data.get("features",[]))
                  item["returned_sample_srid"]=data.get("spatialReference")
                  if data.get("features"):item["first_geometry_has_paths"]=bool(data["features"][0].get("geometry",{}).get("paths"))
                  if data.get("error"):item["provider_error"]=data["error"].get("message")
            except urllib.error.HTTPError as e:item.update({"http_status":e.code,"outcome":"HTTP_REJECTED"})
            except Exception as e:item.update({"outcome":"UNAVAILABLE","error_type":type(e).__name__,"error_detail":str(e)[:160]})
            result["endpoints"][key]=item
            print("SOURCE_PROBE",json.dumps({"key":key,**item},ensure_ascii=False))
          Path("reports/source-probe.json").write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: europe-official-source-access-readonly-probes
          path: reports/
          retention-days: 30

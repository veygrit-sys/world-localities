name: Import pinned locality snapshot
on:
  push:
    branches: ['codex/country-modules-migration-20261104']
    paths: ['.github/workflows/import-country-snapshot.yml']
permissions:
  contents: write
concurrency:
  group: import-country-snapshot
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/country-modules-migration-20261104
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch immutable source and copy original bytes
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/rei-k/world-localities.git "$RUNNER_TEMP/locality-source"
          git -C "$RUNNER_TEMP/locality-source" checkout --detach 6ac889b1e0e570be309335964ff6b27bebeb3a45
          python - <<'PY'
          import os, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'locality-source'
          files = subprocess.check_output(['git', '-C', str(source), 'ls-files', '-z']).decode().split('\0')[:-1]
          assert len(files) == 1591
          for name in files:
              if name == 'README.md':
                  continue
              target = root / name
              if target.exists():
                  if target.read_bytes() == (source / name).read_bytes():
                      continue
                  raise RuntimeError(f'Import would overwrite existing file: {name}')
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source / name, target)
          PY
      - name: Check imported bytes and country contracts
        run: |
          python scripts/country_modules.py verify-migration
          python scripts/country_modules.py validate
          python -m localities layout
          python -m pip install -r scripts/requirements-osm.txt
          python -m unittest discover -s tests -v
      - name: Commit verified import
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import 1591 pinned source files and verify country modules'
          git push origin HEAD:codex/country-modules-migration-20261104

name: Six European microstates source audit and national OSM indexing

on:
  pull_request:
    paths:
      - scripts/europe_microstates.py
      - tests/test_europe_microstates.py
      - registries/europe/microstates/**
      - .github/workflows/microstates-full-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run source-contract tests
        run: |
          python -m py_compile scripts/europe_microstates.py
          python -m unittest discover -s tests -p 'test_europe_microstates.py' -v
          python scripts/europe_microstates.py inventory > /dev/null
          python scripts/europe_microstates.py audit --country all > /dev/null

  full-country-open-osm:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned PBF reader
        run: python -m pip install 'osmium==4.2.0'
      - name: Download all six small sovereign-country extracts with receipts
        run: |
          mkdir -p "$RUNNER_TEMP/microstates-raw" evidence
          for cc in AD LI MC SM VA MT; do
            python scripts/europe_microstates.py download --country "$cc" --directory "$RUNNER_TEMP/microstates-raw" > "evidence/$cc-download.json"
          done
      - name: Full-source identity audit and ODbL-separated SQLite index
        run: |
          python scripts/europe_microstates.py audit --country all > evidence/gazetteer-audit.json
          python scripts/europe_microstates.py build --osm-root "$RUNNER_TEMP/microstates-raw" --output "$RUNNER_TEMP/microstates.sqlite" > evidence/build-report.json
          python scripts/europe_microstates.py verify --db "$RUNNER_TEMP/microstates.sqlite" > evidence/index-verify.json
          python scripts/europe_microstates.py search --country AD --text Canillo --db "$RUNNER_TEMP/microstates.sqlite" > evidence/AD-search.json
          python scripts/europe_microstates.py search --country VA --text 00120 --db "$RUNNER_TEMP/microstates.sqlite" > evidence/VA-search.json
      - name: Compress open derivative index with copyright attribution
        run: |
          zstd -T0 -3 "$RUNNER_TEMP/microstates.sqlite" -o evidence/microstates.sqlite.zst
          printf '%s\n' \
            '© OpenStreetMap contributors, Geofabrik, OpenStreetMap.fr; derived OSM index ODbL-1.0.' \
            'National/country borders of clipped extracts may include buffer features.' \
            'Official reference names are separate source-qualified facts; local IDs are not government codes.' \
            'Address existence, national completeness and postal deliverability are NOT verified.' > evidence/NOTICE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microstates-six-source-qualified-osm-and-audit
          path: evidence/
          retention-days: 30

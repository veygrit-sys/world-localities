name: Complete offline regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-regression-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  common:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install shared pinned test dependencies
        run: python -m pip install -r requirements-caribbean-osm.txt
      - name: Run every common and hierarchy regression with fixed local inputs
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s hierarchy-tests -p 'test_*.py' -v
          python scripts/country_modules.py validate
          python -m localities country validate-catalog
          python scripts/render_country_index.py --check
          python -m localities country verify --country JP
          python -m localities country verify --country DE
          python -m localities country verify --country BM
          python scripts/artifact_audit.py
          python -m localities layout
  regional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: africa
            directory: .
            command: python -m unittest discover -s registries/africa -p 'test*.py' -v
          - region: europe
            directory: .
            command: python registries/europe/test_europe.py -v
          - region: oceania
            directory: registries/oceania
            command: python -m unittest discover -s tests -p 'test_*.py' -v
          - region: caribbean
            directory: .
            command: python registries/caribbean/test_caribbean.py -v
          - region: central-america
            directory: .
            command: python registries/central-america/test_central_registry.py -v
          - region: south-america
            directory: .
            command: python -m unittest discover -s registries/south-america -p 'test*.py' -v
    name: Regional baseline (${{ matrix.region }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify preserved regional contracts without source acquisition
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.command }}

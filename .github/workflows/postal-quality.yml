name: Worldwide postal source integrity

on:
  pull_request:
    paths:
      - 'postal/**'
      - 'localities/postal.py'
      - 'localities/postal_places.py'
      - 'scripts/check_postal_place_coverage.py'
      - 'evaluation/postal-places/**'
      - 'localities/postal_*sources.py'
      - 'localities/postal_official.py'
      - 'localities/postal_source_io.py'
      - 'requirements-postal.txt'
      - 'scripts/world_postcodes.py'
      - 'tests/test_world_postcodes.py'
      - 'tests/test_postal_*.py'
      - '.github/workflows/postal-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-postal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned postal extraction dependency
        run: python -m pip install -r requirements-postal.txt
      - name: Replay saved source bytes, all rows and the world inventory
        run: |
          python -m unittest discover -s tests -p 'test_world_postcodes.py' -v
          python -m unittest discover -s tests -p 'test_postal_*.py' -v
          python scripts/world_postcodes.py verify
          python scripts/check_postal_place_coverage.py

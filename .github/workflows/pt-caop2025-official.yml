name: Portugal CAOP2025 official administrative capture
on:
  push:
    branches:
      - feat/pt-caop2025-national-admin-20261106
    paths:
      - scripts/pt_caop2025_capture.py
      - tests/test_pt_caop2025_capture.py
      - .github/workflows/pt-caop2025-official.yml
  pull_request:
    paths:
      - scripts/pt_caop2025_capture.py
      - tests/test_pt_caop2025_capture.py
      - .github/workflows/pt-caop2025-official.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_pt_caop2025_capture.py' -v
  acquire-official-three-regions:
    needs: contract
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Acquire and hash exact 2025 official DGT archives for mainland Azores Madeira
        run: |
          python scripts/pt_caop2025_capture.py --output-dir "$RUNNER_TEMP/pt-caop2025" > "$RUNNER_TEMP/capture-stdout.json"
      - name: Import approved administrative names into separate source evidence index
        run: |
          python scripts/es_pt_mt_precision.py build --repo . \
            --source-root "$RUNNER_TEMP/pt-caop2025/raw" \
            --receipt "$RUNNER_TEMP/pt-caop2025/receipts/continent-1.json" \
            --receipt "$RUNNER_TEMP/pt-caop2025/receipts/azores-1.json" \
            --receipt "$RUNNER_TEMP/pt-caop2025/receipts/azores-2.json" \
            --receipt "$RUNNER_TEMP/pt-caop2025/receipts/madeira-1.json" \
            --output "$RUNNER_TEMP/pt-caop2025-index.sqlite" > "$RUNNER_TEMP/pt-build.json"
          python scripts/es_pt_mt_precision.py verify --db "$RUNNER_TEMP/pt-caop2025-index.sqlite" > "$RUNNER_TEMP/pt-verify.json"
      - name: Publish provenance report and administrative index without raw external files
        run: |
          mkdir -p reports
          cp "$RUNNER_TEMP/pt-caop2025/dgt-acquisition.json" reports/
          cp "$RUNNER_TEMP/pt-build.json" "$RUNNER_TEMP/pt-verify.json" reports/
          printf '%s\n' 'DGT CAOP2025 administrative boundary/municipality evidence, NOT nationwide postal address or last-mile delivery verification.' 'Source: DGT, license CC BY 4.0, attribution required.' > reports/README.txt
          zstd -3 "$RUNNER_TEMP/pt-caop2025-index.sqlite" -o reports/pt-caop2025-index.sqlite.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portugal-caop2025-three-regions-administrative-evidence
          path: reports/
          retention-days: 14

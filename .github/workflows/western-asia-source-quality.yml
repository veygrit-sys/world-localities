name: Western Asia pinned source and index verification

on:
  push:
    paths:
      - 'scripts/western_asia_*.py'
      - 'scripts/azstat_2024_official_admin.py'
      - 'registries/official/western-asia/**'
      - 'addressing/western_asia_country.py'
      - 'localities/country.py'
      - 'countries/modules.json'
      - 'tests/test_western_asia*.py'
      - 'tests/test_azstat_2024_official_admin.py'
      - '.github/workflows/western-asia-source-quality.yml'
  pull_request:
    paths:
      - 'scripts/western_asia_*.py'
      - 'scripts/azstat_2024_official_admin.py'
      - 'registries/official/western-asia/**'
      - 'addressing/western_asia_country.py'
      - 'localities/country.py'
      - 'countries/modules.json'
      - 'tests/test_western_asia*.py'
      - 'tests/test_azstat_2024_official_admin.py'
      - '.github/workflows/western-asia-source-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Replay pinned source bytes and source-grain tests
        run: |
          python -m localities western-asia verify
          python -m unittest discover -s tests -p 'test_western_asia*.py' -v
          python -m unittest discover -s tests -p 'test_azstat_2024_official_admin.py' -v
      - name: Build index and compare every record and search name
        run: |
          python -m localities western-asia build --output /tmp/western-asia.sqlite
          python -m localities western-asia verify-index --db /tmp/western-asia.sqlite
          python -m localities layout
